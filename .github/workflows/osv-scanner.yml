name: osv-scanner
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "12 12 * * 1"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan both projects
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f
        with:
          scan-args: |-
            --output-file=osv-results.json
            --format=json
            --include-git-root
            -r
            ./wallet-review-lab
            ./order-review-lab
      - name: Preserve dependency scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: error
