rules:
  - id: wallet-float-money
    message: Money must not be converted to or represented as float in the wallet domain.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: float($AMOUNT)
          - pattern: "$AMOUNT: float"
      - metavariable-regex:
          metavariable: $AMOUNT
          regex: ".*(amount|balance|money|price).*"
  - id: wallet-review-instruction-in-source
    message: Source contains language that may be attempting to instruct a review agent.
    severity: WARNING
    languages: [python]
    pattern-regex: "(?i)(ignore|bypass|skip).{0,40}(review|security|instruction|policy)"
